<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: #f4f7fc;
        padding: 40px;
      }

      .container {
        max-width: 1200px;
        margin: auto;
      }

      .card {
        background: #fff;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        margin-bottom: 30px;
      }

      h2 {
        color: #333;
        margin-bottom: 20px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #555;
      }

      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        outline: none;
        transition: 0.3s;
      }

      .form-group input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 5px rgba(79, 70, 229, 0.3);
      }

      .btn {
        background: #4f46e5;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
        font-size: 15px;
        transition: 0.3s;
      }

      .btn:hover {
        background: #3730a3;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      table thead {
        background: #4f46e5;
        color: white;
      }

      table th,
      table td {
        padding: 14px;
        text-align: center;
      }

      table tbody tr {
        background: white;
        border-bottom: 1px solid #eee;
      }

      table tbody tr:hover {
        background: #f8f9ff;
      }

      .action-btn {
        border: none;
        padding: 8px 15px;
        border-radius: 6px;
        color: white;
        cursor: pointer;
      }

      .edit {
        background: #f59e0b;
      }

      .delete {
        background: #ef4444;
      }

      .edit:hover {
        background: #d97706;
      }

      .delete:hover {
        background: #dc2626;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Form Section -->
      <div class="card">
        <h2>Student Registration With REST API</h2>

        <form>
          <div class="form-grid">
            <div class="form-group">
              <label>Name</label>
              <input type="text" placeholder="Enter Name" />
            </div>

            <div class="form-group">
              <label>Age</label>
              <input type="number" placeholder="Enter Age" />
            </div>

            <div class="form-group">
              <label>Course</label>
              <input type="text" placeholder="Enter Course" />
            </div>

            <div class="form-group">
              <label>City</label>
              <input type="text" placeholder="Enter City" />
            </div>
          </div>

          <button class="btn">Save Student</button>
        </form>
      </div>

      <!-- Table Section -->
      <div class="card">
        <h2>Student Records</h2>

        <table id="show">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Age</th>
              <th>Course</th>
              <th>City</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody>
            
          </tbody>
        </table>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      $(document).ready(function () {
        function loadTable() {
          $.ajax({
            url: "http://localhost/Backend_php/php-rest-api/api-fatch-all.php",
            type: "GET",
            // dataType: "json",


            success: function (data) {
              $("#show tbody").html("");
                console.log(data);
              if (data.status == false) {
                $("#show tbody").append(
                  "<tr><td colspan='6'>" + data.message + "</td></tr>",
                );
              } else {
                $.each(data, function (key, value) {
                  $("#show tbody").append(`
                            <tr>
                                <td>${value.id}</td>
                                <td>${value.Name}</td>
                                <td>${value.Age}</td>
                                <td>${value.Course}</td>
                                <td>${value.City}</td>
                                <td>
                                    <button class="action-btn edit" data-id="${value.id}">
                                        Edit
                                    </button>

                                    <button class="action-btn delete" data-id="${value.id}">
                                        Delete
                                    </button>
                                </td>
                            </tr>
                        `);
                });
              }
            },

            error: function () {
              alert("Data Load Failed");
            },
          });
        }

        loadTable();
      });
    </script>
  </body>
</html>
