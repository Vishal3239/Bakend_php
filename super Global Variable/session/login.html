<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 360px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: #e6f1fb;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 24px;
        }

        .login-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .login-header p {
            font-size: 13px;
            color: #888;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #185FA5;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #185FA5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: #0c447c;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #bbb;
            margin-top: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="login-card">

        <div class="login-header">
            <div class="avatar">👤</div>
            <h2>Welcome back</h2>
            <p>Apne account mein login karein</p>
        </div>

        <form action="login.php" method="POST">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter Username.." required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-login">Login karein</button>

        </form>

        <p class="footer-text">PHP Backend Project</p>

    </div>

</body>
</html>
